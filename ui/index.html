<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lokanon</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/ui/fonts.css">
<link rel="stylesheet" href="/ui/app.css">
<link rel="stylesheet" href="/ui/einfuehrung/fuehrung.css">
</head>
<body>
<div class="band" id="uebung-band" hidden data-tour="uebung-band">
  <b>Übungsvorgang</b><span>Beispieldaten, Ihre eigenen Daten sind nicht betroffen.</span>
  <span style="flex:1"></span><button class="btn" type="button" id="uebung-ende">Einführung beenden</button>
</div>
<div class="app">
  <header class="titel">
    <a class="marke" href="#" id="marke" aria-label="Lokanon, Startseite">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect width="20" height="20" rx="4" fill="#16365C"/><rect x="4" y="6" width="12" height="3" rx="1" fill="#fff"/><rect x="4" y="11" width="7" height="3" rx="1" fill="#7FD3C4"/></svg>
      <b>Lokanon</b>
    </a>
    <span class="kontext" id="kontext"></span>
    <span class="fill"></span>
    <button class="cmd icon" type="button" id="btn-hilfe" aria-label="Hilfe und Einführung" aria-haspopup="menu" data-tour="hilfe-menue">
      <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M6.3 6.2a1.8 1.8 0 0 1 3.5.5c0 1.2-1.8 1.5-1.8 2.6M8 11.3v.2"/></svg>
    </button>
  </header>
  <div class="befehle" id="befehle" role="toolbar" aria-label="Befehle" data-tour="befehlsleiste"></div>
  <div class="koerper">
    <nav class="nav" id="nav" aria-label="Bereiche"></nav>
    <main class="view" id="view"></main>
  </div>
  <footer class="status" id="status"></footer>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal-root" id="modal-root" hidden></div>

<script src="/ui/einfuehrung/hilfetexte.js"></script>
<script src="/ui/einfuehrung/drehbuch.js"></script>
<script src="/ui/einfuehrung/fuehrung.js"></script>
<script src="/ui/app.js"></script>
</body>
</html>
